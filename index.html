
<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>SmartSchedule AI | Gestão Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              emerald: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              },
              zinc: {
                950: '#09090b',
              }
            },
            animation: {
              'spin-slow': 'spin 8s linear infinite',
              'reverse-spin-slow': 'reverse-spin 12s linear infinite',
            },
            keyframes: {
              'reverse-spin': {
                from: { transform: 'rotate(360deg)' },
                to: { transform: 'rotate(0deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --transition-speed: 0.3s;
      }
      body {
        font-family: 'Inter', sans-serif;
        transition: background-color var(--transition-speed) ease;
        overflow: hidden; /* Evita scroll na body, o scroll será controlado nos containers */
      }
      .sidebar-transition {
        transition: width var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1), 
                    transform var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1),
                    background-color var(--transition-speed) ease,
                    left var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-header {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .active-scale:active {
        transform: scale(0.96);
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Garante que o main container não quebre o layout com a sidebar */
      main {
        min-width: 0;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
        "react": "https://esm.sh/react@^19.2.3",
        "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100">
    <div id="root"></div>
  </body>
</html>
